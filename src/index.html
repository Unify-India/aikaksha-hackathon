<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Kaksha | Exam workspace for teachers</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create exams by voice, review every question and answer key, and grade handwritten answer sheets.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F8FA">
  <script>
    // Apply the saved theme and palette (or the OS setting) before first paint so the page never flashes the wrong colours.
    (function () {
      var theme = 'light';
      var palette = 'aurora';
      try {
        var savedTheme = localStorage.getItem('ai-kaksha-theme');
        theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var savedPalette = localStorage.getItem('ai-kaksha-palette');
        if (savedPalette === 'aurora' || savedPalette === 'ember' || savedPalette === 'iris') palette = savedPalette;
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-palette', palette);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#0A0C12' : '#F7F8FA');
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Serif+Devanagari:wght@500&display=swap"
    rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
